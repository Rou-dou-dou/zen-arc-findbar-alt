name: Build Release Zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create zen-arc-findbar-alt.zip
        run: |
          mkdir -p dist/zen-arc-findbar-alt
          for f in chrome.css theme.json README.md image.png userChrome.css user.js install.sh install-mod.js LICENSE; do
            [ -e "$f" ] && cp -r "$f" dist/zen-arc-findbar-alt/
          done
          ls -la dist/zen-arc-findbar-alt
          (cd dist && zip -r ../zen-arc-findbar-alt.zip zen-arc-findbar-alt)
          ls -lh zen-arc-findbar-alt.zip

      - name: Upload zip to Release
        uses: softprops/action-gh-release@v2
        with:
          files: zen-arc-findbar-alt.zip
